services:
  postgres-localtest:
    image: postgres:18-alpine
    container_name: sub2api-rehearsal-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCALTEST_POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./localtest-data/postgres:/var/lib/postgresql/data
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-localtest:
    image: redis:8-alpine
    container_name: sub2api-rehearsal-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCALTEST_REDIS_PORT:-16379}:6379"
    volumes:
      - ./localtest-data/redis:/data
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
