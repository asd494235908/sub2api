<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="32" fill="#F6F1E8"/>
  <rect x="48" y="48" width="1104" height="624" rx="28" fill="#FFFDF8" stroke="#D9C9AE" stroke-width="4"/>
  <text x="84" y="126" fill="#1F2937" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="700">接入前先准备 3 个值</text>
  <text x="84" y="168" fill="#6B7280" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">先把信息准备好，后面填设置时就不会来回切页面找。</text>

  <rect x="84" y="220" width="1032" height="128" rx="24" fill="#FDEFD8" stroke="#F1C27D" stroke-width="3"/>
  <circle cx="146" cy="284" r="28" fill="#D97706"/>
  <text x="138" y="294" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text>
  <text x="198" y="274" fill="#111827" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">Base URL</text>
  <text x="198" y="314" fill="#374151" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">接口地址，不是官网首页。优先用后台给你的完整地址。</text>
  <text x="816" y="297" fill="#92400E" font-family="Menlo,Consolas,monospace" font-size="22">https://token.gepinapi.com/v1</text>

  <rect x="84" y="380" width="1032" height="128" rx="24" fill="#E8F3FF" stroke="#8AB6F9" stroke-width="3"/>
  <circle cx="146" cy="444" r="28" fill="#2563EB"/>
  <text x="138" y="454" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text>
  <text x="198" y="434" fill="#111827" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">API Key</text>
  <text x="198" y="474" fill="#374151" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">你的密钥，通常以 sk- 开头，直接复制完整内容。</text>
  <text x="894" y="457" fill="#1D4ED8" font-family="Menlo,Consolas,monospace" font-size="22">sk-xxxx</text>

  <rect x="84" y="540" width="1032" height="88" rx="24" fill="#E8F8EE" stroke="#7CCB98" stroke-width="3"/>
  <circle cx="146" cy="584" r="28" fill="#15803D"/>
  <text x="138" y="594" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text>
  <text x="198" y="574" fill="#111827" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">Model</text>
  <text x="198" y="608" fill="#374151" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">要调用的模型名，要和后台开放给你的名字完全一致。</text>
  <text x="960" y="592" fill="#166534" font-family="Menlo,Consolas,monospace" font-size="22">GPT-5.4</text>
</svg>
