  <rect x="400" y="178" width="400" height="96" rx="24" fill="#FFFFFF" stroke="#A78BFA" stroke-width="4"/>
  <text x="488" y="236" fill="#4C1D95" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">打开 Settings / AI / Models</text>

  <path d="M600 274V330" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
  <path d="M600 330L584 310" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
  <path d="M600 330L616 310" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>

