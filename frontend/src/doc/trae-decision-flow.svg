  <text x="414" y="402" fill="#312E81" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">有没有看到 Base URL / API Key / Model？</text>

  <path d="M448 468L282 548" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
  <path d="M752 468L918 548" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  <text x="318" y="536" fill="#047857" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">看到了</text>
  <text x="818" y="536" fill="#B91C1C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">没看到</text>

  <rect x="74" y="560" width="430" height="154" rx="28" fill="#ECFDF5" stroke="#34D399" stroke-width="4"/>
