  <text x="110" y="662" fill="#065F46" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">1. 填 Base URL</text>
  <text x="110" y="694" fill="#065F46" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">2. 填 API Key</text>
  <text x="286" y="694" fill="#065F46" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">3. 填 Model</text>

